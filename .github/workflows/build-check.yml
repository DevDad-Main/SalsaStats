name: Windows build check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: '2022'
      VisualStudioVersion: '17.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '2022'
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Build and test installer without publishing
        run: |
          npm run build:win 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Host "::error title=Build failed::$tail"
            exit 1
          }